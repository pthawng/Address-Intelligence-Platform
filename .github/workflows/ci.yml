name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal tools test)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Dependency boundaries
        run: go run ./tools/dependencycheck
      - name: Module integrity
        run: |
          go mod tidy -diff
          go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...
      - name: PostgreSQL migrations and runtime integration
        env:
          TEST_DATABASE_URL: postgres://postgres:integration-test-only@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./test/integration
      - name: Validate local Compose configuration
        run: |
          docker compose --env-file docker/.env.example -f docker/compose.yaml --profile worker config --quiet
          docker compose --env-file docker/.env.example -f docker/compose.yaml -f docker/compose.dev.yaml --profile worker config --quiet
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
